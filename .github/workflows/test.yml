name: Test
'on':
  pull_request:
  push:
    branches-ignore:
      - master
      - next
      - beta
      - '*.x'
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: lts/*
      - run: npm clean-install
      - name: Install test fixture dependencies
        run: npm clean-install
        working-directory: test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
